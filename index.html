<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoloH Förlag</title>
  <meta name="description" content="HoloH Förlag">
  <style>
    :root {
      --bg: #faf8f4;
      --fg: #1f1d1a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1917; --fg: #f1ede6; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      padding: 0 16px;
    }
    h1 {
      font-weight: normal;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: 0.02em;
      text-align: center;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>HoloH Förlag</h1>
</body>
</html>
